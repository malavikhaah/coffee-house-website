kind = "web"
previewPath = "/"
title = "Coffee House"
description = "A warm, inviting coffee shop website for discovering signature drinks, exploring the menu, and visiting a neighborhood café."
version = "1.0.0"
id = "artifacts/coffee-house"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18455

[services.development]
run = "pnpm --filter @workspace/coffee-house run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/coffee-house", "run", "build" ]
serve = "static"
publicDir = "artifacts/coffee-house/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18455"
BASE_PATH = "/"
